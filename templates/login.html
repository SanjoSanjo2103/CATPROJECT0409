{% extends "base.html" %}
{% block title %}Login — CloudReclaim{% endblock %}

{% block fullpage %}
<div class="login-container">
    <div class="card login-card">
        <div class="brand-icon">☁️</div>
        <h2>CloudReclaim</h2>
        <p class="subtitle">University Cloud Lab Resource Manager</p>

        <form method="POST" action="{{ url_for('auth.login') }}">
            <div class="form-group">
                <input type="text" name="username" class="form-input" placeholder="Username" required autofocus>
            </div>
            <div class="form-group">
                <input type="password" name="password" class="form-input" placeholder="Password" required>
            </div>
            <button type="submit" class="btn btn-primary">Sign In</button>
        </form>

        <div class="login-credentials">
            <h4>Demo Credentials</h4>
            <p class="text-sm" style="margin-bottom: 8px;">
                <strong>Admin:</strong> <code>admin1</code> / <code>password123</code>
            </p>
            <p class="text-sm" style="margin-bottom: 8px;">
                <strong>Instructor:</strong> <code>prof_miller</code> / <code>password123</code>
            </p>
            <p class="text-sm">
                <strong>Instructor:</strong> <code>prof_kumar</code> / <code>password123</code>
            </p>
        </div>
    </div>
</div>
{% endblock %}
